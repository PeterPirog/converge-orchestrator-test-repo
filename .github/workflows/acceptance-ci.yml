name: Acceptance CI

on:
  pull_request:
    branches:
      - converge-acceptance
  push:
    branches:
      - converge-acceptance

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip pytest
      - run: python -m pytest -q tests/test_shared_tools_fake_terminal.py
